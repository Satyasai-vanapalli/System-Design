spring:
  application:
    name: dsa-roadmap-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:roadmap;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope: [openid, profile, email]

server:
  port: ${PORT:8080}
  error:
    include-message: never

app:
  origin: ${APP_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:30}
  seed: ${SEED_DATA:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints.web.exposure.include: health,info

